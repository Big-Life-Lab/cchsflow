  confirmed_by:
    - "PUMF direct analysis (.RData files)"
    - "GoogleLM NotebookLM cross-check"
    - "ICES Dictionary v1.0.0 (14,005 variables)"

  pumf_availability:
    - cycle: "2001"
      available: true
      ontario_50plus_n: 9930
      valid_responses: 9393
      scale: "3-point"
    - cycle: "2007-2008"
      available: false
      ontario_50plus_n: 17861
      valid_responses: 0
      reason: "Ontario did not select optional Sleep module"
    - cycle: "2011-2012"
      available: false
      ontario_50plus_n: 19730
      valid_responses: 0
      reason: "Ontario did not select optional Sleep module"
    - cycle: "2013-2014"
      available: false
      ontario_50plus_n: 21031
      valid_responses: 0
      doslp_flag: 2
      reason: "Ontario did not select optional Sleep module"
    - cycle: "2015-2016"
      available: true
      ontario_50plus_n: 15139
      valid_responses: 14366
      doslp_flag: 1
      scale: "5-point"
    - cycle: "2017-2018"
      available: false
      ontario_50plus_n: 15905
      valid_responses: 0
      doslp_flag: 2
      reason: "Ontario did not select optional Sleep module"

  linked_file_availability:
    - period: "2001"
      available: true
      dataset: "CCHS2001_ONT_LINK_11"
      variables: ["GENA_03", "GENA_04", "GENA_05", "GENA_06"]
    - period: "2002"
      available: true
      dataset: "CCHS2002_ONT_LINK_12"
      variables: ["GENB_03", "GENB_04", "GENB_05"]
      note: "GENB_06 (Difficulty awake) not found"
    - period: "2003"
      available: partial
      dataset: "CCHS2003_ONT_LINK_21"
      variables: ["DPSC_09"]
      note: "Only Depression module trouble sleeping (measures change, not status)"
    - period: "2005"
      available: false
    - period: "2007-2014"
      available: false
      note: "SLP variables not in Ontario Linked/Share files"
    - period: "2015-2016"
      available: true
      dataset: "CCHS201516_ONT_SHARE"
      variables: ["SLP_005", "SLP_010", "SLP_015", "SLP_020"]
    - period: "2017-2018"
      available: true
      dataset: "CCHS201718_ONT_SHARE"
      variables: ["SLP_005", "SLP_010", "SLP_015", "SLP_020"]

  critical_finding: |
    Ontario sleep data has a 13-year gap (2003-2014) in both PUMF and Linked files.
    Sleep was Optional Content from 2007-2018.
    Ontario only selected Sleep module for 2015-2016.
    ICES Linked/Share files add 2002 and 2017-2018 not available in PUMF.

